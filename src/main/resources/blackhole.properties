# Schwarzschild Black Hole Simulation Configuration
# Physical and rendering parameters for college microproject

# Stellar mass of black hole in solar masses (M☉)
massSolarMasses=10.0

# Initial camera orbital distance from black hole center (in Schwarzschild units)
cameraDistance=95.0

# Cinematic Dutch-angle roll around forward axis (degrees). Negative = counterclockwise tilt.
cameraRoll=-34.0

# Accretion disk inner radius (ISCO = 3.0 * Rs = 6.0 in normalized units; use 5.2 for tight photon ring)
diskInnerRadius=5.2

# Accretion disk outer radius (in normalized units)
diskOuterRadius=22.0

# Reference peak temperature of the accretion disk in Kelvin
diskTemperature=50000.0

# Volumetric Accretion Disk geometry & density parameters
diskThickness=0.62
densityScale=1.15
absorption=0.85
turbulenceScale=1.00
turbulenceStrength=0.75
rotationSpeed=1.20
spiralStrength=2.80
emissionStrength=1.20
innerIllumination=0.90

# Rendering quality preset: LOW, MEDIUM, or HIGH
qualityPreset=MEDIUM
colorPalette=GARGANTUA_AMBER

# Visual debug mode: 0=Final, 1=Density, 2=Temp, 3=OpticalDepth, 4=Emission, 5=Absorption, 6=Lensing, 7=Geodesic Steps
debugMode=0

# Numerical geodesic integration steps per camera ray (default from preset)
raySteps=160

# Base numerical integration step size (dλ)
rayStepSize=0.24

# Post-processing exposure value
exposure=1.15

# Post-processing bloom/glow toggle
bloom=true

# Window dimensions
windowWidth=1280
windowHeight=720

# Display debug telemetry HUD overlay on startup (toggle with ~ key)
showDebug=false
